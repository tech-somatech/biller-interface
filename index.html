<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top Up Billing</title>
  <link rel="stylesheet" href="suara.css" />
</head>

<body>
  <!-- ✅ Wrapper dengan class unik untuk isolasi CSS -->
  <div class="topup-iframe-wrapper">
    <iframe
        src="http://localhost:8000/" 
        title="Top Up Billing"
        allow="clipboard-read; clipboard-write"
        id="myCompFrame"
        class="topup-iframe"
    ></iframe>
  </div>

  <!-- 🎨 MODAL OVERLAY (Initially hidden) -->
  <div id="modalOverlay" class="modal-overlay"></div>
  
  <!-- 🎨 MODAL CONTAINER (Initially hidden) -->
  <div id="modalContainer" class="modal-container">
    <button id="modalCloseBtn" class="modal-close-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <iframe
        id="modalIframe"
        class="modal-iframe"
        title="Checkout Modal"
        allow="clipboard-read; clipboard-write"
    ></iframe>
  </div>

  <script src="suara.js"></script>
</body>
</html>
